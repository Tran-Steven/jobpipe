name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Node worker syntax
        working-directory: workers/node
        run: npm run check
      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/static/app.js
      - name: Validate optional LinkedIn visual hide extension
        run: |
          node --check extensions/linkedin-hide/content.js
          node --check extensions/linkedin-hide/rules.js
          node -e "const m=require('./extensions/linkedin-hide/manifest.json');const allowed=['https://www.linkedin.com/jobs/*','https://linkedin.com/jobs/*'];if(m.manifest_version!==3||m.permissions.join(',')!=='storage'||m.host_permissions||m.content_scripts.length!==1||m.content_scripts.some(s=>s.matches.some(x=>!allowed.includes(x))))process.exit(1)"
          node --test tests/node/test_linkedin_hide_rules.cjs
      - name: Validate public workflow and privacy boundaries
        run: python -m pytest -q tests/test_publication_safety.py
      - name: Install required Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run offline and sanitized-browser suite
        run: python -m pytest -q --ignore=tests/test_real_forms.py
