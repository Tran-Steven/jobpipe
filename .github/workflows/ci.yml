name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Node worker syntax
        working-directory: workers/node
        run: npm run check
      - name: Validate public workflow and privacy boundaries
        run: python -m pytest -q tests/test_publication_safety.py
      - name: Install required Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Run offline and sanitized-browser suite
        run: python -m pytest -q --ignore=tests/test_real_forms.py
